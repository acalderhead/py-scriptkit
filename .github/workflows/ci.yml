name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    # 2 OSes x 3 Python versions = 6 jobs. Minimum supported stays 3.11.
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Create virtual environment
        # setup-uv may already provision a .venv; --clear makes this idempotent.
        run: uv venv --clear

      - name: Install project (dev extra)
        run: uv pip install -e ".[dev]"

      - name: Lint
        run: uv run --no-project python -m ruff check .

      - name: Type check
        run: uv run --no-project python -m pyright

      - name: Test
        run: uv run --no-project python -m pytest -q
