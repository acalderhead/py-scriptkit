[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "scriptkit"
description = "Stdlib-first toolkit for single-file Python scripts: dataclass config with CLI+env wiring, semantic logging with a rich fallback, and small utilities."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Aidan Calderhead" }]
license = { text = "MIT" }
dynamic = ["version"]
dependencies = []

[project.optional-dependencies]
# Decorated console logging. Without this extra, scriptkit uses its stdlib
# fallback (still exposes the semantic vocabulary via [TAG] prefixes).
rich = ["rich_logger @ git+https://github.com/acalderhead/rich-logger.git@v1.0.4"]
# Azure helpers in scriptkit.azure.
azure = ["azure-identity>=1.16"]
# Local development / CI.
dev = ["pytest>=8", "ruff>=0.6", "yapf>=0.40", "pyright>=1.1.390"]

[project.scripts]
# Cross-platform scaffolder: `scriptkit new NAME [--tag] [--dir]`.
scriptkit = "scriptkit.cli:main"

[project.urls]
Homepage = "https://github.com/acalderhead/py-scriptkit"
Repository = "https://github.com/acalderhead/py-scriptkit"

[tool.hatch.metadata]
# Required because the optional extras pin git URLs (direct references).
allow-direct-references = true

[tool.hatch.version]
# Single source of truth: the package's __version__.
path = "src/scriptkit/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/scriptkit"]

[tool.pytest.ini_options]
testpaths = ["tests"]

# Ruff is used as a LINTER only (the hard-constraint gate) — not as the
# formatter. YAPF (see [tool.yapf]) owns code layout; Ruff owns correctness,
# import sorting, and modern-syntax checks. Do not run `ruff format` here.
[tool.ruff]
line-length = 100
target-version = "py311"
# The bundled template is a scaffold with intentional placeholders — don't lint it.
extend-exclude = ["src/scriptkit/templates"]

[tool.ruff.lint]
# Pin the rule set explicitly so lint results are deterministic across ruff
# versions and machines (E/W pycodestyle, F pyflakes, I import-sort, UP pyupgrade).
select = ["E", "F", "I", "W", "UP"]

# YAPF is the auto-formatter (the tunable layout engine). This is a barebones
# starting point — the pep8 base plus a column limit aligned with Ruff's
# line-length so the formatter and linter never disagree about wrapping.
# Phase 5 will grow this section with the project's personal style rules.
[tool.yapf]
based_on_style = "pep8"
column_limit = 100

[tool.yapfignore]
# Mirror the Ruff/pyright exclude: the bundled template is a placeholder scaffold.
ignore_patterns = ["src/scriptkit/templates/*"]

[tool.pyright]
# Type-check the shipped package against the minimum supported interpreter. The
# package ships a py.typed marker, so this gate protects the types consumers see.
include = ["src"]
# The bundled template is intentionally incomplete (placeholder logic) — the
# scaffolder ships it as data, it is not part of the checked package surface.
exclude = ["src/scriptkit/templates"]
pythonVersion = "3.11"
typeCheckingMode = "standard"
